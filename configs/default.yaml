defaults:
  - datasets/default.yaml
  - models/default.yaml
  - agents/default.yaml
  - summarization/default.yaml
  - experiment/default.yaml
  - evaluation/default.yaml

project:
  name: "VideoSummarizationAgent"
  schema_version: "2.0"
  seed: 42

paths:
  output_root: "outputs"
  summary_output_dir: "outputs/inference_results"
  evaluation_output_dir: "outputs/evaluation"
  ablation_output_dir: "outputs/ablation"
  checkpoint_dir: "checkpoints"

logging:
  level: "INFO"
  wandb:
    enabled: false
    project: "video-agent-project"

llm:
  backend: "rule_based"
  model_name: null
  temperature: 0.0
  max_tokens: 0
